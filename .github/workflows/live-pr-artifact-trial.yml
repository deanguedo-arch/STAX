name: live-pr-artifact-trial

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: live-pr-artifact-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-live-pr-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh 25-case live PR artifact trial
        run: npm run pr-artifact:live-trial:refresh:force-live

      - name: Refresh 50-case live PR artifact trial
        run: npm run pr-artifact:live-trial:full:refresh:force-live

      - name: Upload live PR trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pr-artifact-trial-artifacts
          path: |
            fixtures/real_use/live_pr_artifact_trial_latest.json
            fixtures/real_use/live_pr_artifact_trial_full_latest.json
            docs/releases/STAX_Project-Control_9_5_RC4/artifacts/pr_artifact_live_trial.json
            docs/releases/STAX_Project-Control_9_5_RC4/artifacts/pr_artifact_live_trial.md
            docs/releases/STAX_Project-Control_9_5_RC4/artifacts/pr_artifact_live_trial_full.json
            docs/releases/STAX_Project-Control_9_5_RC4/artifacts/pr_artifact_live_trial_full.md
          if-no-files-found: warn
