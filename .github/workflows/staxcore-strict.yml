name: staxcore-strict

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: staxcore-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-staxcore-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify GitHub PR adapter token and no-token paths
        run: |
          npm test -- tests/githubPrArtifactAdapter.test.ts
          GITHUB_TOKEN= STAX_GITHUB_TOKEN= npm test -- tests/githubPrArtifactAdapter.test.ts

      - name: Validate hardened STAX gates
        run: npm run validate:hardened

      - name: Validate STAX Core strict release gate
        run: npm run validate:staxcore:strict:ci

      - name: Upload STAX Core release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staxcore-release-artifacts
          path: |
            runs/staxcore_release/**/*.json
            runs/staxcore_release/**/*.md
          if-no-files-found: warn
